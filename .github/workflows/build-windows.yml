name: build-windows

# Builds the Windows standalone app on a Windows runner (PyInstaller cannot
# cross-compile) and commits the zip back into release/.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'server.py'
      - 'desktop.py'
      - 'desktop_occultation.py'
      - 'app/**'
      - 'tools/**'
      - 'build_icon/SatOccult.ico'
      - '.github/workflows/build-windows.yml'

permissions:
  contents: write

concurrency:
  group: build-windows
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    steps:
      # fetch-depth 0: the final step rebases the zip commit onto whatever landed
      # on main during the ~6 min build; a depth-1 shallow clone cannot rebase
      # across those commits and failed exactly that way on 9450fdd (2026-07-26).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build dependencies
        run: pip install pywebview pyinstaller

      - name: Build with PyInstaller
        run: >
          pyinstaller --noconfirm --clean --windowed --name SatOccult
          --icon build_icon/SatOccult.ico --add-data "app;app"
          --add-data "tools;tools"
          --add-data "LICENSE;." --add-data "NOTICE.md;."
          --collect-all webview desktop.py

      - name: Zip the app folder
        run: Compress-Archive -Path dist/SatOccult -DestinationPath release/SatOccult-windows-x64.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: SatOccult-windows-x64
          path: release/SatOccult-windows-x64.zip

      - name: Commit release zip
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add release/SatOccult-windows-x64.zip
          git commit -m "Windows build: release/SatOccult-windows-x64.zip [skip ci]"
          git pull --rebase origin main
          git push
